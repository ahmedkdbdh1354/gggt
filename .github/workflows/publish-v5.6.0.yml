name: Publish Personal AI v5.6.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v5.6.0.yml"
      - "overlay/v5.6.0/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    env:
      BASE_VERSION: "5.4.0"
      BASE_SHA256: "d99f011d3bdebddc1329be61d2482e5b32b205f72364d1fe729bb82f552d2ad5"
      AUDIO_VERSION: "5.5.0"
      AUDIO_SHA256: "ed273fbd1ca7c8f83d075d9be6458c109a9e21080dac3f5bf52aadca4ef15a71"
      VERSION: "5.6.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct base and overlays
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf build
          mkdir -p build/source

          cat payload/v${BASE_VERSION}/part-*.b64 > build/base.b64
          base64 -d build/base.b64 > build/base.tar.xz
          echo "${BASE_SHA256}  build/base.tar.xz" | sha256sum -c -
          tar -xJf build/base.tar.xz -C build/source

          PACKAGE_ROOT="build/source/personal-ai-activity-collector"
          test -d "$PACKAGE_ROOT"

          cat overlay/v${AUDIO_VERSION}/part-*.b64 > build/audio.b64
          base64 -d build/audio.b64 > build/audio.tar.xz
          echo "${AUDIO_SHA256}  build/audio.tar.xz" | sha256sum -c -
          tar -xJf build/audio.tar.xz -C "$PACKAGE_ROOT"

          cat overlay/v${VERSION}/part-*.b64 > build/fix.b64
          base64 -d build/fix.b64 > build/fix.tar.xz
          FIX_SHA256="$(sha256sum build/fix.tar.xz | awk '{print $1}')"
          echo "FIX_SHA256=${FIX_SHA256}" >> "$GITHUB_ENV"
          echo "fix_sha256=${FIX_SHA256}" >> "$GITHUB_OUTPUT"
          tar -xJf build/fix.tar.xz -C "$PACKAGE_ROOT"

          echo "v${VERSION} overlay SHA-256: ${FIX_SHA256}"
          echo "Files changed by v${VERSION} overlay:"
          tar -tJf build/fix.tar.xz | sed -n '1,200p'

      - name: Validate Python and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          PACKAGE_ROOT="build/source/personal-ai-activity-collector"
          cd "$PACKAGE_ROOT"
          python3 -m compileall -q .
          python3 -m venv .ci-venv
          . .ci-venv/bin/activate
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then pip install -r requirements.txt; fi
          python -m unittest discover -s tests -v
          deactivate
          rm -rf .ci-venv

      - name: Validate browser extension JavaScript
        shell: bash
        run: |
          set -Eeuo pipefail
          PACKAGE_ROOT="build/source/personal-ai-activity-collector"
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find "$PACKAGE_ROOT/browser_extension" -type f -name '*.js' -print0)

      - name: Validate v5.6 runtime identity
        shell: bash
        run: |
          set -Eeuo pipefail
          PACKAGE_ROOT="build/source/personal-ai-activity-collector"
          python3 - "$PACKAGE_ROOT" <<'PY'
          import json, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          expected = "5.6.0"
          candidates = [root / "pyproject.toml", root / "browser_extension/chromium/manifest.json", root / "browser_extension/firefox/manifest.json"]
          seen = []
          if candidates[0].exists():
              text = candidates[0].read_text(encoding="utf-8")
              m = re.search(r'^version\s*=\s*["\']([^"\']+)', text, re.M)
              if m: seen.append((str(candidates[0]), m.group(1)))
          for path in candidates[1:]:
              if path.exists():
                  seen.append((str(path), json.loads(path.read_text(encoding="utf-8")).get("version")))
          if not seen:
              raise SystemExit("No version-bearing runtime files found")
          print("Version-bearing files:", seen)
          if any(version != expected for _, version in seen):
              raise SystemExit(f"Expected every public runtime version to be {expected!r}")
          PY

      - name: Build latest release archive and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/release
          (cd build/source && zip -qr "../release/Personal-AI-Activity-Collector-v${VERSION}-LATEST.zip" personal-ai-activity-collector)
          PACKAGE_SHA256="$(sha256sum "build/release/Personal-AI-Activity-Collector-v${VERSION}-LATEST.zip" | awk '{print $1}')"
          echo "PACKAGE_SHA256=${PACKAGE_SHA256}" >> "$GITHUB_ENV"
          {
            echo "${PACKAGE_SHA256}  Personal-AI-Activity-Collector-v${VERSION}-LATEST.zip"
            echo "${FIX_SHA256}  overlay-v${VERSION}.tar.xz"
            echo "${AUDIO_SHA256}  overlay-v${AUDIO_VERSION}.tar.xz"
            echo "${BASE_SHA256}  base-v${BASE_VERSION}.tar.xz"
          } > build/release/SHA256SUMS.txt

      - name: Promote v5.6.0 in installer and repository docs
        shell: bash
        run: |
          set -Eeuo pipefail
          export FIX_SHA256 PACKAGE_SHA256
          python3 <<'PY'
          from pathlib import Path
          import os

          fix_sha = os.environ["FIX_SHA256"]
          package_sha = os.environ["PACKAGE_SHA256"]

          installer = r'''#!/usr/bin/env bash
          set -Eeuo pipefail

          REPO="https://raw.githubusercontent.com/ahmedkdbdh1354/gggt/main"
          VERSION="5.6.0"
          BASE_VERSION="5.4.0"
          AUDIO_VERSION="5.5.0"
          BASE_SHA256="d99f011d3bdebddc1329be61d2482e5b32b205f72364d1fe729bb82f552d2ad5"
          AUDIO_SHA256="ed273fbd1ca7c8f83d075d9be6458c109a9e21080dac3f5bf52aadca4ef15a71"
          FIX_SHA256="__FIX_SHA__"

          for cmd in curl base64 sha256sum tar; do
            command -v "$cmd" >/dev/null 2>&1 || { echo "Error: $cmd is required." >&2; exit 1; }
          done

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          echo "Personal AI Activity Collector v$VERSION"
          echo "Downloading verified base runtime..."
          : > "$TMP/base.b64"
          for i in $(seq -w 0 14); do
            curl -fsSL "$REPO/payload/v$BASE_VERSION/part-$i.b64" >> "$TMP/base.b64"
          done
          base64 -d "$TMP/base.b64" > "$TMP/base.tar.xz"
          echo "$BASE_SHA256  $TMP/base.tar.xz" | sha256sum -c -
          mkdir -p "$TMP/extract"
          tar -xJf "$TMP/base.tar.xz" -C "$TMP/extract"
          PACKAGE_ROOT="$TMP/extract/personal-ai-activity-collector"
          test -d "$PACKAGE_ROOT" || { echo "Error: verified base package root missing." >&2; exit 1; }

          echo "Downloading verified v$AUDIO_VERSION audio-context update..."
          : > "$TMP/audio.b64"
          for part in part-00.b64 part-01.b64 part-02a.b64 part-02b.b64 part-02c.b64 part-03.b64 part-04a.b64 part-04b.b64 part-04c.b64 part-05.b64; do
            curl -fsSL "$REPO/overlay/v$AUDIO_VERSION/$part" >> "$TMP/audio.b64"
          done
          base64 -d "$TMP/audio.b64" > "$TMP/audio.tar.xz"
          echo "$AUDIO_SHA256  $TMP/audio.tar.xz" | sha256sum -c -
          tar -xJf "$TMP/audio.tar.xz" -C "$PACKAGE_ROOT"

          echo "Downloading verified v$VERSION final fixes..."
          : > "$TMP/fix.b64"
          for part in part-00.b64 part-01.b64 part-02.b64 part-03.b64 part-04.b64; do
            curl -fsSL "$REPO/overlay/v$VERSION/$part" >> "$TMP/fix.b64"
          done
          base64 -d "$TMP/fix.b64" > "$TMP/fix.tar.xz"
          echo "$FIX_SHA256  $TMP/fix.tar.xz" | sha256sum -c -
          tar -xJf "$TMP/fix.tar.xz" -C "$PACKAGE_ROOT"

          INSTALLER="$PACKAGE_ROOT/packaging/install.sh"
          test -f "$INSTALLER" || { echo "Error: installer missing from verified package." >&2; exit 1; }
          chmod +x "$INSTALLER"
          exec "$INSTALLER"
          '''
          installer = "\n".join(line[10:] if line.startswith("          ") else line for line in installer.splitlines()) + "\n"
          Path("install.sh").write_text(installer.replace("__FIX_SHA__", fix_sha), encoding="utf-8")

          readme = Path("README.md").read_text(encoding="utf-8")
          readme = readme.replace("Current public release: **v5.5.0**", "Current public release: **v5.6.0**")
          readme = readme.replace("## What v5.5.0 captures", "## What v5.6.0 captures")
          readme = readme.replace("verifies the v5.4.0 base runtime and the v5.5.0 update overlay with SHA-256 before installation", "verifies the v5.4.0 base runtime, v5.5.0 audio-context overlay, and v5.6.0 final-fix overlay with SHA-256 before installation")
          if "## v5.6.0 final fixes" not in readme:
              marker = "## Existing context capture"
              section = f'''## v5.6.0 final fixes\n\n- promotes the completed Audio Context/STT work as the current public runtime\n- keeps microphone input and system-output audio as separate evidence streams\n- keeps browser/media timing correlation for play/pause/seek/ended evidence\n- includes the latest privacy, discovery, reporting, and installer hardening present in the v5.6.0 overlay\n- publishes a verified install path plus a packaged GitHub Release asset\n\nVerified v5.6.0 final-fix overlay SHA-256:\n\n```text\n{fix_sha}\n```\n\nVerified v5.6.0 packaged release ZIP SHA-256:\n\n```text\n{package_sha}\n```\n\n'''
              readme = readme.replace(marker, section + marker)
          Path("README.md").write_text(readme, encoding="utf-8")

          release_dir = Path("release/v5.6.0")
          release_dir.mkdir(parents=True, exist_ok=True)
          (release_dir / "SHA256SUMS.txt").write_text(
              f"{package_sha}  Personal-AI-Activity-Collector-v5.6.0-LATEST.zip\n"
              f"{fix_sha}  overlay-v5.6.0.tar.xz\n",
              encoding="utf-8",
          )
          (release_dir / "RELEASE_NOTES.md").write_text(
              "# Personal AI Activity Collector v5.6.0\n\n"
              "Finalized Audio Context / local STT release with the latest v5.6.0 fixes and hardening. "
              "The release was reconstructed from the verified v5.4.0 base + verified v5.5.0 audio overlay + v5.6.0 final-fix overlay, then compile-checked and unit-tested before publishing.\n",
              encoding="utf-8",
          )
          PY
          chmod +x install.sh

      - name: Commit promoted installer and release metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh README.md release/v5.6.0/SHA256SUMS.txt release/v5.6.0/RELEASE_NOTES.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish v5.6.0 as latest verified release"
            git push origin HEAD:main
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --tags
          TARGET="$(git rev-parse origin/main)"
          ZIP="build/release/Personal-AI-Activity-Collector-v${VERSION}-LATEST.zip"
          SUMS="build/release/SHA256SUMS.txt"
          NOTES="release/v5.6.0/RELEASE_NOTES.md"

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$ZIP" "$SUMS" --clobber
          else
            gh release create "v${VERSION}" "$ZIP" "$SUMS" \
              --target "$TARGET" \
              --title "Personal AI Activity Collector v${VERSION}" \
              --notes-file "$NOTES"
          fi

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Personal-AI-Activity-Collector-v5.6.0-LATEST
          path: |
            build/release/Personal-AI-Activity-Collector-v5.6.0-LATEST.zip
            build/release/SHA256SUMS.txt
          if-no-files-found: error
