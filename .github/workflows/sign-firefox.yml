name: Sign Firefox Extension

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/sign-firefox-trigger"

permissions:
  contents: write

jobs:
  sign-firefox:
    runs-on: ubuntu-latest
    env:
      VERSION: "5.5.0"
      BASE_VERSION: "5.4.0"
      BASE_SHA256: "d99f011d3bdebddc1329be61d2482e5b32b205f72364d1fe729bb82f552d2ad5"
      OVERLAY_SHA256: "ed273fbd1ca7c8f83d075d9be6458c109a9e21080dac3f5bf52aadca4ef15a71"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct verified v5.5.0 source package
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/source

          cat payload/v${BASE_VERSION}/part-*.b64 > build/base.b64
          base64 -d build/base.b64 > build/base.tar.xz
          echo "${BASE_SHA256}  build/base.tar.xz" | sha256sum -c -
          tar -xJf build/base.tar.xz -C build/source

          cat \
            overlay/v${VERSION}/part-00.b64 \
            overlay/v${VERSION}/part-01.b64 \
            overlay/v${VERSION}/part-02a.b64 \
            overlay/v${VERSION}/part-02b.b64 \
            overlay/v${VERSION}/part-02c.b64 \
            overlay/v${VERSION}/part-03.b64 \
            overlay/v${VERSION}/part-04a.b64 \
            overlay/v${VERSION}/part-04b.b64 \
            overlay/v${VERSION}/part-04c.b64 \
            overlay/v${VERSION}/part-05.b64 > build/overlay.b64
          base64 -d build/overlay.b64 > build/overlay.tar.xz
          echo "${OVERLAY_SHA256}  build/overlay.tar.xz" | sha256sum -c -
          tar -xJf build/overlay.tar.xz -C build/source/personal-ai-activity-collector

      - name: Locate and validate Firefox extension
        id: extension
        shell: bash
        run: |
          set -Eeuo pipefail
          MANIFEST="$(find build/source -type f -path '*/browser_extension/firefox/manifest.json' | head -n1)"
          if [[ -z "${MANIFEST}" ]]; then
            echo "Firefox manifest.json not found" >&2
            exit 1
          fi
          EXT_DIR="$(dirname "${MANIFEST}")"
          echo "dir=${EXT_DIR}" >> "$GITHUB_OUTPUT"

          python3 - "$MANIFEST" <<'PY'
          import json, sys
          p = sys.argv[1]
          with open(p, encoding='utf-8') as f:
              m = json.load(f)
          mv = m.get('manifest_version')
          gecko = m.get('browser_specific_settings', {}).get('gecko', {})
          addon_id = gecko.get('id') or m.get('applications', {}).get('gecko', {}).get('id')
          version = m.get('version')
          print(f"manifest_version={mv}")
          print(f"version={version}")
          print(f"addon_id={addon_id}")
          if version != '5.5.0':
              raise SystemExit(f'Expected Firefox extension 5.5.0, got {version!r}')
          if mv == 3 and not addon_id:
              raise SystemExit('Manifest V3 requires browser_specific_settings.gecko.id before AMO signing')
          PY

      - name: Prepare clean extension source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/firefox-clean
          rsync -a --delete --exclude='*.xpi' --exclude='web-ext-artifacts' "${{ steps.extension.outputs.dir }}/" build/firefox-clean/

      - name: Install Mozilla web-ext
        run: npm install --global web-ext@latest

      - name: Lint Firefox extension
        run: web-ext lint --source-dir build/firefox-clean

      - name: Sign with Mozilla AMO (unlisted/self-distributed)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${AMO_JWT_ISSUER:-}" || -z "${AMO_JWT_SECRET:-}" ]]; then
            echo "Missing AMO_JWT_ISSUER or AMO_JWT_SECRET repository secrets." >&2
            exit 1
          fi
          mkdir -p signed-artifacts
          web-ext sign \
            --channel=unlisted \
            --source-dir build/firefox-clean \
            --artifacts-dir signed-artifacts \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --timeout 900000

      - name: Show signed artifact
        run: ls -lah signed-artifacts

      - name: Upload signed XPI as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-firefox-signed-v${{ env.VERSION }}
          path: signed-artifacts/*.xpi
          if-no-files-found: error

      - name: Publish signed XPI to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="firefox-signed-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" signed-artifacts/*.xpi --clobber
          else
            gh release create "$TAG" signed-artifacts/*.xpi \
              --title "Firefox signed extension v${VERSION}" \
              --notes "Mozilla-signed unlisted/self-distributed Firefox extension for Personal AI Activity Collector v${VERSION}."
          fi
